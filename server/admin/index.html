<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoreBuddy Admin Panel</title>
  <meta name="description" content="StoreBuddy Cloud POS — Platform Administration Console" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text x='50%' y='62%' font-family='Arial' font-weight='bold' font-size='44' text-anchor='middle' fill='white'>SB</text></svg>" />
</head>
<body>

  <!-- ── Login Page ──────────────────────────────────────── -->
  <div id="loginPage">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">SB</div>
        <div>
          <div class="login-brand-name">StoreBuddy</div>
          <div class="login-brand-sub">Cloud POS Platform</div>
        </div>
      </div>
      <h1 class="login-title">Admin Sign In</h1>
      <p class="login-subtitle">Sign in with your platform admin credentials to continue</p>
      <form id="loginForm" autocomplete="on">
        <div class="login-input-group">
          <label class="login-label" for="loginEmail">Email Address</label>
          <input id="loginEmail" type="email" name="email" class="login-input" placeholder="Enter your email" autocomplete="email" required />
        </div>
        <div class="login-input-group">
          <label class="login-label" for="loginPassword">Password</label>
          <input id="loginPassword" type="password" name="password" class="login-input" placeholder="Enter your password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ── App Shell ───────────────────────────────────────── -->
  <div id="appShell" style="display:none">
    <!-- Sidebar -->
    <aside id="sidebar"></aside>

    <!-- Main Area -->
    <div id="mainArea">
      <!-- Topbar -->
      <header class="topbar">
        <div id="headerTitle" class="topbar-title">Dashboard</div>
        <div class="topbar-right">
          <span class="topbar-time" id="topbarTime"></span>
        </div>
      </header>

      <!-- Content -->
      <main id="mainContent"></main>
    </div>
  </div>

  <!-- ── Global Modal ─────────────────────────────────────── -->
  <div id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Modal</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Toast Container ─────────────────────────────────── -->
  <div id="toastContainer" aria-live="polite"></div>

  <!-- ── App Entry Point ─────────────────────────────────── -->
  <script type="module">
    import { init } from '/admin/js/app.js?v=2';

    // Live clock in topbar
    function updateClock() {
      const el = document.getElementById('topbarTime');
      if (!el) return;
      const now = new Date();
      el.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Bootstrap the app
    init();
  </script>
</body>
</html>
