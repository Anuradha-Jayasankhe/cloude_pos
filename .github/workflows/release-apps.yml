name: Release Applications

on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: write

env:
  APP_DIR: store_buddy_pos

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Derive release metadata
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#release-v}"

          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "Tag '$tag' does not contain a version after 'release-v'." >&2
            exit 1
          fi

          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=StoreBuddy POS v$version" >> "$GITHUB_OUTPUT"

  build-android:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ github.run_number }}"

      - name: Build Android App Bundle
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build appbundle --release \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ github.run_number }}"

      - name: Prepare Android release assets
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.version_name }}'
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/store-buddy-pos-android-${version}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/store-buddy-pos-android-${version}.aab"

      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: store_buddy_pos/release-assets/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Windows release
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          flutter build windows --release --build-name "${{ needs.prepare.outputs.version_name }}" --build-number "${{ github.run_number }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows installer
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version_name }}'
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = Join-Path (Get-Location) 'build/windows/installer'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'windows/installer/store_buddy_pos.iss'

      - name: Archive Windows bundle
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version_name }}'
          $archivePath = "build/windows/store-buddy-pos-windows-$version.zip"

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          Compress-Archive -Path "build/windows/x64/runner/Release" -DestinationPath $archivePath

      - name: Prepare Windows release asset
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version_name }}'
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "build/windows/store-buddy-pos-windows-$version.zip" "$releaseDir/store-buddy-pos-windows-$version.zip" -Force
          Copy-Item "build/windows/installer/store-buddy-pos-windows-$version-setup.exe" "$releaseDir/store-buddy-pos-windows-$version-setup.exe" -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: store_buddy_pos/release-assets/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-android
      - build-windows

    steps:
      - name: Download Android assets
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: List downloaded release assets
        run: find release-assets -maxdepth 2 -type f | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*